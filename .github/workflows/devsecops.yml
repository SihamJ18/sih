```yaml
name: Automatisation des tests DevSecOps

on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Controle des dependances avec Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --include-dev-deps \
            /project

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Test Dockerfile avec Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            aquasec/trivy:latest config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project/Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
```
